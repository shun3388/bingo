<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お題ドロー（ちいかわ風）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fff3f8;--fg:#3b3350;--card:#fff;--line:#ffc6d9;--ac:#ff6fa3;--hit:#ffe3ee;--mute:#8d7f9e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231f2e;--fg:#f4eefa;--card:#2f2a3d;--line:#5a4a72;--ac:#ff8fb6;--hit:#5b3a55;--mute:#aaa2bd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#231f2e;--fg:#f4eefa;--card:#2f2a3d;--line:#5a4a72;--ac:#ff8fb6;--hit:#5b3a55;--mute:#aaa2bd;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",Meiryo,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:1.4rem;margin:0 0 12px}h2{font-size:1.05rem;margin:18px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700;font-size:1.1rem;padding:10px 22px}button:disabled{opacity:.5}
#stage{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:22px 14px;text-align:center;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:10px}
#no{font-size:clamp(3rem,16vw,5.5rem);font-weight:800;color:var(--ac);line-height:1}
#tp{font-size:clamp(1.1rem,4.6vw,1.6rem);font-weight:700;line-height:1.45}
#stage.roll{border-color:var(--ac);animation:sh .12s infinite}#stage.roll #tp{opacity:.55}
#stage.pop{border-color:var(--ac);animation:pop .7s}
@keyframes sh{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-2px)}100%{transform:translate(0,0)}}
@keyframes pop{0%{transform:scale(.8);box-shadow:0 0 0 0 var(--ac)}40%{transform:scale(1.07)}100%{transform:scale(1);box-shadow:0 0 0 24px transparent}}
.st{font-weight:700;margin:12px 0 8px}#chips{display:flex;flex-wrap:wrap;gap:4px}
.ch{min-width:2.1em;text-align:center;padding:3px 4px;border-radius:6px;border:1px solid var(--line);font-size:.8rem;color:var(--mute)}.ch.d{background:var(--hit);color:var(--fg);border-color:var(--ac);font-weight:700}
#hist{padding-left:0;list-style:none;margin:0}#hist li{padding:7px 4px;border-bottom:1px solid var(--line)}#hist b{display:inline-block;min-width:3.6em;color:var(--ac)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}#md[hidden]{display:none}.mb{background:var(--card);color:var(--fg);border-radius:16px;padding:20px;max-width:360px;width:100%}.mb p{margin:0;line-height:1.6;font-weight:700}.mr{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
body{background-image:radial-gradient(var(--line) 1.6px,transparent 1.8px);background-size:26px 26px}
#stage{border-style:dashed;border-width:4px;border-radius:32px}button,select{border-radius:999px}.mb{border-radius:26px}#hist li{border-bottom-style:dashed}
.mc{width:auto;height:150px;max-width:100%;margin:0 auto;animation:fl 2.4s ease-in-out infinite}.mi{display:block;height:84px;margin:0 auto 10px}.hm{width:38px;height:auto;vertical-align:middle;margin-right:8px}
#stage.roll .mc{animation:wig .35s ease-in-out infinite}#stage.pop .mc{animation:jmp .8s}
@keyframes fl{50%{transform:translateY(-8px)}}@keyframes wig{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes jmp{0%{transform:translateY(0)}30%{transform:translateY(-34px) rotate(-8deg)}60%{transform:translateY(0)}80%{transform:translateY(-10px) rotate(6deg)}100%{transform:translateY(0)}}
.note{color:var(--mute);font-size:.85rem}
#ru{font-size:1rem;font-weight:700;padding:8px;border-radius:10px;background:var(--hit);display:none}#ru:not(:empty){display:block}#ru.w{background:#e5484d;color:#fff}
table{border-collapse:collapse;width:100%;font-size:.82rem;margin-top:8px}td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}td small{color:var(--mute)}
</style>
</head>
